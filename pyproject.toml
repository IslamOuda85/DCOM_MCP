[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dcom-mcp"
version = "0.1.0"
description = "Source-grounded Data Communications course context over MCP"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "PyYAML>=6.0.2,<7", "rank-bm25==0.2.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "Pillow>=11,<13"]

[project.scripts]
dcom-mcp = "dcom_mcp.server:main"

[tool.setuptools.packages.find]
include = ["dcom_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

